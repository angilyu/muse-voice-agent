[project]
name = "muse-voice-agent"
version = "0.1.0"
description = "MCP server that lets an AI assistant phone businesses for you: bookings, quotes, availability and questions (Retell + LangGraph)"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
authors = [
    { name = "Wenjing Yu", email = "angilyu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "langchain[openai]>=1.4",
    "langgraph>=1.2",
    "mcp>=2.2",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
    "websockets>=15",
]

[project.optional-dependencies]
# Only needed for VOICE_BACKEND=livekit (the agent.py worker); the Retell deploy omits it.
livekit = ["livekit-agents[langchain]~=1.8"]

[project.scripts]
muse-voice-agent = "muse_voice_agent.agent:main"
muse-voice-mcp = "muse_voice_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "github-copilot-sdk>=1.0.15",
    "livekit-agents[langchain]~=1.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
